name: frontend-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/data-root-check.mjs
      - run: node tools/session-route-check.mjs
      - run: node tools/usage-check.mjs
      - run: node tools/codex-session-check.mjs
      - run: node tools/task-errors-check.mjs
      - run: node tools/concurrency-check.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/frontend-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-screenshots
          path: frontend-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  windows-path:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/windows-path-check.mjs
