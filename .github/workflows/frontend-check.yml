name: frontend-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/frontend-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-screenshots
          path: frontend-artifacts/
          if-no-files-found: ignore
          retention-days: 3
