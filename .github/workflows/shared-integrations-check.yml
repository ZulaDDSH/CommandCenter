name: shared-integrations-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test shared MCP adapter
        run: python tools/shared-mcp-adapter-test.py
      - name: Test shared MCP migration on Windows
        if: runner.os == 'Windows'
        run: python tools/shared-mcp-migrate-test.py
